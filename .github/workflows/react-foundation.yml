name: React foundation

on:
  pull_request:
    paths:
      - 'modern/**'
      - 'src/**'
      - '.github/workflows/react-foundation.yml'
  push:
    branches:
      - main
      - feature/react-typescript-foundation
    paths:
      - 'modern/**'
      - 'src/**'
      - '.github/workflows/react-foundation.yml'

permissions:
  contents: write

jobs:
  modern-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install legacy dependencies
        run: npm ci
      - name: Install React app dependencies
        working-directory: modern
        run: npm install --no-audit --no-fund
      - name: Typecheck React app
        working-directory: modern
        run: npm run typecheck
      - name: Build React app
        working-directory: modern
        run: npm run build
      - name: Production shell smoke check
        run: |
          test -f modern/dist/index.html
          test -f modern/dist/manifest.webmanifest
          test -f modern/dist/sw.js
          test -f modern/dist/icons/icon-192.png
          test -f modern/dist/icons/icon-512.png
          grep -q "Trilha Concursos" modern/dist/index.html
      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: trilha-modern-production-candidate
          path: modern/dist
          if-no-files-found: error
          retention-days: 7
      - name: Publish React preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          find react-preview -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R modern/dist/. react-preview/
          touch react-preview/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-preview
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar preview React [skip ci]"
            git push
          fi
