name: React preview

on:
  push:
    branches:
      - feat/react-preview-sprint-6
    paths-ignore:
      - 'react-preview/**'

permissions:
  contents: write

jobs:
  publish-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install legacy dependencies
        run: npm ci
      - name: Install React dependencies
        working-directory: modern
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: modern
        run: npm run typecheck
      - name: Build preview
        working-directory: modern
        run: npm run build
      - name: Publish preview folder
        run: |
          rm -rf react-preview
          mkdir -p react-preview
          cp -R modern/dist/. react-preview/
          touch react-preview/.nojekyll
      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add react-preview
          if git diff --cached --quiet; then
            echo 'Preview unchanged.'
            exit 0
          fi
          git commit -m 'chore: publicar candidato React para validação'
          git push origin HEAD:${GITHUB_REF_NAME}
