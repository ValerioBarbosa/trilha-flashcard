name: Deploy React app to GitHub Pages

# Corte de produção concluído (ver docs/PRODUCTION_CUTOVER.md): o Source do Pages
# já está em "GitHub Actions" e o primeiro deploy manual (workflow_dispatch) foi
# validado em produção. A partir daqui, todo push em main publica automaticamente.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install legacy dependencies
        run: npm ci
      - name: Install React app dependencies
        working-directory: modern
        run: npm install --no-audit --no-fund
      - name: Build React app
        working-directory: modern
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: modern/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live site is serving the React build
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if echo "$body" | grep -q "Trilha Concursos"; then
              echo "OK: live site is serving the React build."
              exit 0
            fi
            echo "Attempt $attempt: marker not found yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::O site publicado em $url não está servindo o build do React (marcador 'Trilha Concursos' ausente)."
          echo "::error::Verifique Settings > Pages > Build and deployment > Source — precisa estar em 'GitHub Actions', não 'Deploy from a branch'."
          exit 1
