<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>Trilha Flashcard — Desbloquear tudo</title>
    <link rel="icon" href="icons/favicon-32.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #0b1220;
        --surface: #141c2e;
        --surface-2: #182234;
        --ink: #eef1f8;
        --muted: #9aa3ba;
        --line: #2a3349;
        --blue: #5b93ff;
        --coral: #ff8a7a;
        --gradient: linear-gradient(120deg, var(--blue), var(--coral));
        --green: #4fd18b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #05070d;
        color: var(--ink);
      }

      .paywall {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, rgba(91, 147, 255, 0.16), transparent 55%),
          radial-gradient(circle at 85% 15%, rgba(255, 138, 122, 0.14), transparent 50%),
          var(--background);
        display: flex;
        flex-direction: column;
        padding-bottom: 132px;
      }

      .paywall-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px 8px;
      }

      .paywall-icon-button {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        display: grid;
        place-items: center;
        flex: none;
      }

      .paywall-icon-button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }

      .paywall-brand {
        flex: 1;
        text-align: center;
      }

      .paywall-brand strong {
        display: block;
        font-size: 15px;
        letter-spacing: 0.02em;
      }

      .paywall-progress {
        margin: 6px auto 0;
        width: 64px;
        height: 4px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }

      .paywall-progress span {
        display: block;
        height: 100%;
        width: 38%;
        background: var(--gradient);
      }

      .paywall-offer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px 0;
      }

      .paywall-offer-label {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .paywall-offer-label strong {
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .paywall-timer {
        display: flex;
        align-items: center;
        gap: 4px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }

      .paywall-timer span {
        min-width: 40px;
        text-align: center;
        padding: 6px 4px;
        border-radius: 10px;
        background: var(--gradient);
        color: #0b1220;
        font-size: 16px;
      }

      .paywall-timer b {
        color: var(--muted);
        font-weight: 600;
      }

      .paywall-hero {
        padding: 18px 20px 0;
      }

      h1 {
        font-family: "DM Serif Display", "DM Sans", serif;
        font-size: clamp(28px, 6vw, 34px);
        line-height: 1.15;
        margin: 6px 0 12px;
      }

      h1 em {
        font-style: normal;
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .paywall-sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .paywall-sub strong {
        color: var(--ink);
      }

      .paywall-hero-art {
        height: 120px;
        margin-bottom: 22px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background:
          repeating-linear-gradient(135deg, rgba(91, 147, 255, 0.12) 0 2px, transparent 2px 14px),
          var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .paywall-hero-art .stack {
        width: 58px;
        height: 78px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        background: var(--surface-2);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }

      .paywall-hero-art .stack:nth-child(2) {
        transform: translateY(-6px) rotate(-4deg);
        border-color: var(--blue);
      }

      .paywall-hero-art .stack:nth-child(3) {
        transform: translateY(-10px) rotate(5deg);
        border-color: var(--coral);
      }

      .paywall-plans {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .plan-card {
        position: relative;
        display: block;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
        background: var(--surface);
        cursor: pointer;
      }

      .plan-card input {
        position: absolute;
        opacity: 0;
      }

      .plan-card.selected {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(91, 147, 255, 0.16);
      }

      .plan-badge {
        position: absolute;
        top: -12px;
        right: 14px;
        font-size: 11px;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--gradient);
        color: #0b1220;
      }

      .plan-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .plan-name {
        font-size: 17px;
        font-weight: 700;
      }

      .plan-discount {
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 4px 9px;
        border-radius: 8px;
        background: rgba(255, 138, 122, 0.16);
        color: var(--coral);
      }

      .plan-price {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: 12px;
      }

      .plan-old {
        text-decoration: line-through;
        color: var(--muted);
        font-size: 13px;
      }

      .plan-new {
        font-size: 13px;
        color: var(--ink);
      }

      .plan-price strong {
        margin-left: auto;
        font-size: 30px;
        line-height: 1;
      }

      .plan-price strong b {
        font-size: 16px;
        font-weight: 700;
      }

      .plan-price small {
        color: var(--muted);
        font-size: 12px;
      }

      .paywall-footer {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(11, 18, 32, 0), var(--background) 24%);
      }

      .paywall-cta {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-size: 16px;
        font-weight: 700;
        color: #0b1220;
        background: var(--gradient);
        box-shadow: 0 14px 30px rgba(91, 147, 255, 0.25);
      }

      .paywall-social {
        text-align: center;
        margin: 10px 0;
        font-size: 13px;
        color: var(--muted);
      }

      .paywall-trust {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .paywall-trust div {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }

      .paywall-trust svg {
        width: 18px;
        height: 18px;
        stroke: var(--green);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <main class="paywall">
      <header class="paywall-top">
        <button class="paywall-icon-button" type="button" aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <div class="paywall-brand">
          <strong>trilha flashcard</strong>
          <div class="paywall-progress"><span></span></div>
        </div>
        <button class="paywall-icon-button" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
      </header>

      <div class="paywall-offer-row">
        <p class="paywall-offer-label"><strong>Garanta</strong> seu desconto</p>
        <div class="paywall-timer" id="paywall-timer" aria-label="Tempo restante da oferta">
          <span id="timer-h">19</span><b>:</b><span id="timer-m">56</span><b>:</b><span id="timer-s">41</span>
        </div>
      </div>

      <section class="paywall-hero">
        <h1>Sua <em>aprovação</em> está mais perto do que parece.</h1>
        <p class="paywall-sub">
          Libere <strong>todos os baralhos por disciplina</strong> e a <strong>revisão espaçada completa</strong>.
          Desconto exclusivo só hoje!
        </p>

        <div class="paywall-hero-art" aria-hidden="true">
          <span class="stack"></span>
          <span class="stack"></span>
          <span class="stack"></span>
        </div>

        <form class="paywall-plans" id="paywall-plans">
          <label class="plan-card" data-price="0,66" data-cta="R$0,66/dia">
            <input type="radio" name="plan" value="mensal" />
            <div class="plan-badge">+50 cartões prontos</div>
            <div class="plan-main">
              <div>
                <div class="plan-name">1 mês</div>
                <span class="plan-discount">50% de desconto</span>
              </div>
              <div class="plan-price">
                <div>
                  <div class="plan-old">R$ 39,90</div>
                  <div class="plan-new">R$ 19,90</div>
                </div>
                <strong>R$<b>0</b>,66<small style="display:block">por dia</small></strong>
              </div>
            </div>
          </label>

          <label class="plan-card selected" data-price="0,27" data-cta="R$0,27/dia">
            <input type="radio" name="plan" value="anual" checked />
            <div class="plan-badge">+50 cartões prontos</div>
            <div class="plan-main">
              <div>
                <div class="plan-name">12 meses</div>
                <span class="plan-discount">80% de desconto</span>
              </div>
              <div class="plan-price">
                <div>
                  <div class="plan-old">R$ 479,90</div>
                  <div class="plan-new">R$ 95,90</div>
                </div>
                <strong>R$<b>0</b>,27<small style="display:block">por dia</small></strong>
              </div>
            </div>
          </label>
        </form>
      </section>

      <footer class="paywall-footer">
        <button class="paywall-cta" id="paywall-cta" type="button">Desbloquear agora — R$0,27/dia</button>
        <p class="paywall-social">🔓 3.482 concurseiros desbloquearam hoje</p>
        <div class="paywall-trust">
          <div>
            <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z" /></svg>
            Pagamento seguro
          </div>
          <div>
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="m8 13 2.5 2.5L16 10" /></svg>
            Cancele quando quiser
          </div>
          <div>
            <svg viewBox="0 0 24 24"><path d="M12 3v11M8 10l4 4 4-4M5 18v2h14v-2" /></svg>
            Sem compromisso
          </div>
        </div>
      </footer>
    </main>

    <script>
      (function () {
        var totalSeconds = 19 * 3600 + 56 * 60 + 41;
        var hEl = document.getElementById("timer-h");
        var mEl = document.getElementById("timer-m");
        var sEl = document.getElementById("timer-s");
        var pad = function (n) { return String(n).padStart(2, "0"); };

        setInterval(function () {
          if (totalSeconds <= 0) return;
          totalSeconds -= 1;
          var h = Math.floor(totalSeconds / 3600);
          var m = Math.floor((totalSeconds % 3600) / 60);
          var s = totalSeconds % 60;
          hEl.textContent = pad(h);
          mEl.textContent = pad(m);
          sEl.textContent = pad(s);
        }, 1000);

        var cards = document.querySelectorAll(".plan-card");
        var cta = document.getElementById("paywall-cta");

        cards.forEach(function (card) {
          card.addEventListener("click", function () {
            cards.forEach(function (c) { c.classList.remove("selected"); });
            card.classList.add("selected");
            card.querySelector("input").checked = true;
            cta.textContent = "Desbloquear agora — " + card.dataset.cta;
          });
        });
      })();
    </script>
  </body>
</html>
